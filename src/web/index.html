<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" />
    <!-- iOS reads none of the manifest's icons and only some of its fields, so they are repeated here. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tight Arse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Tight Arse</title>
    <!-- Sets the theme before first paint so the wrong one never flashes. It has to be inline to run that early, so M9's
         CSP allows it by hash: changing a single character here changes the hash. The logic mirrors src/theme/theme.ts. -->
    <script>
      try {
        var p = localStorage.getItem('budget.theme')
      } catch (e) {}
      var t = p === 'light' || p === 'dark' ? p : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = t
      document.documentElement.style.colorScheme = t
      document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0F172A' : '#F8FAFC'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
