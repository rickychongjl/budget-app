x-app: &app
  image: budget-api:dev
  build:
    context: .
    dockerfile: src/Budget.Api/Dockerfile
  environment:
    ConnectionStrings__Budget: Server=sql;Database=budget;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?copy .env.example to .env and set a password}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Same order as production: the migration job finishes before the API starts.
  migrate:
    <<: *app
    entrypoint: ["dotnet", "jobs/Budget.Jobs.dll", "migrate"]
    depends_on:
      sql:
        condition: service_healthy

  api:
    <<: *app
    environment:
      ConnectionStrings__Budget: Server=sql;Database=budget;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true
      # Local only: lets the session cookie work over plain http. Production never sets this.
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sql-data:
